version: '3'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  build:
    desc: Build the application binary
    cmds:
      - go build -o bin/soi-tro.exe ./cmd/main.go

  run:
    desc: Run the application
    cmds:
      - go run ./cmd/main.go

  clean:
    desc: Clean build artifacts
    cmds:
      - cmd: cmd /c rmdir /s /q bin
        platforms: [windows]
      - cmd: rm -rf bin
        platforms: [linux, darwin]

  test:
    desc: Run all tests in the project
    cmds:
      - go test -v ./...

  test:cover:
    desc: Run all tests with code coverage profile
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  test:race:
    desc: Run all tests with the race detector enabled (requires CGO)
    cmds:
      - go test -v -race ./...

  tag:
    desc: "Auto-increment patch version tag and push (options: minor, major)"
    cmds:
      - go run scripts/release.go {{.CLI_ARGS}}
