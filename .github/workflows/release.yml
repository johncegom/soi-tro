name: Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            archive_format: zip
          - goos: linux
            goarch: amd64
            suffix: ""
            archive_format: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: ""
            archive_format: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: ""
            archive_format: tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build Binary
        run: |
          mkdir -p dist
          env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o dist/soi-tro${{ matrix.suffix }} ./cmd/main.go

      - name: Package Release Asset (Zip / Tar)
        run: |
          cd dist
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            zip -j ../soi-tro-${{ matrix.goos }}-${{ matrix.goarch }}.zip soi-tro${{ matrix.suffix }}
          else
            tar -czf ../soi-tro-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz soi-tro${{ matrix.suffix }}
          fi
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: soi-tro-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            soi-tro-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            soi-tro-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
